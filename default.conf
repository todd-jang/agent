# IP별 요청 제한: 초당 5회, 순간 버스트 10회까지 허용
limit_req_zone $binary_remote_addr zone=chat:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=guest_chat:10m rate=3r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;         # /chat 입력은 2000자 제한이므로 충분
    limit_req_status 429;

    location = / {
        try_files /index.html =404;
    }

    # LB 자신의 상태 확인용
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 앱 헬스체크 (외부 모니터링 / 로드밸런서 헬스체크 연동용)
    location = /health {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 모델 준비 상태 확인용
    location = /ready {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # FastAPI Swagger UI, OpenAPI schema, and ReDoc
    location ^~ /docs {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /openapi.json {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ^~ /redoc {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Chat API
    location = /chat {
        limit_req zone=chat burst=10 nodelay;

        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;      # 앱의 LLM_TIMEOUT(300s)보다 길게

        # 연결 실패/502/503은 다른 노드에서 재시도. timeout은 재시도하지 않음(이미 150초 소비).
        # POST 재시도를 허용(non_idempotent): 이 에이전트는 읽기 전용이라 안전. 쓰기 도구를 추가하면 제거할 것.
        proxy_next_upstream error http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    # Anonymous requests require valid Turnstile verification and are limited to 3/minute per IP.
    location = /guest/config {
        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /guest/chat {
        limit_req zone=guest_chat;

        proxy_pass http://agent_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
    }

    # Other paths are not exposed
    location / {
        return 404;
    }
}

# HTTPS: 인증서를 ./certs 에 두고 lb/docker-compose.yml 의 443 포트와 certs 볼륨 주석을 해제한 뒤 아래를 활성화하세요.
# 활성화할 때는 위 server 블록은 `return 301 https://$host$request_uri;` 로 바꾸고 /chat 설정을 이 블록으로 옮기세요.
