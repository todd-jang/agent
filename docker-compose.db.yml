# 공유 PostgreSQL (개발/테스트용). 운영에서는 관리형 DB(RDS, Cloud SQL 등)를 쓰는 것을 권장.
# 실행: docker compose -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?AGENT_RO_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro      # 빈 데이터 디렉터리에서 최초 1회만 실행됨
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"          # 노드들이 접근할 사설 IP로 지정 (공인 IP 금지)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
