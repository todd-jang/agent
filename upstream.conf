# 백엔드 노드 목록: 단일 호스트에서는 Docker 내부 서비스명(app:80)을 사용합니다.
# 멀티 노드 배포 시에는 각 GPU 노드의 사설 IP로 변경하세요.
upstream agent_nodes {
    least_conn;                       # 처리 중인 요청이 가장 적은 노드로 (LLM 요청은 처리 시간 편차가 큼)

    # 단일 서버 올인원 배포 (Docker Compose 내부 DNS)
    server app:80 max_fails=2 fail_timeout=10s;

    # 멀티 노드 배포 시 주석 해제 및 IP 변경:
    # server 10.0.0.11:80 max_fails=2 fail_timeout=10s;
    # server 10.0.0.12:80 max_fails=2 fail_timeout=10s;

    keepalive 16;
}
